name: MediCore Backend CI/CD Pipeline

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/medicore?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/medicore?schema=public"
        run: npx prisma validate && npm run prisma:generate

      - name: TypeScript Build Check
        run: npm run build

      - name: Run Unit & Integration Tests (Phases 2-15, Security & Billing)
        run: npm test

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high || true
